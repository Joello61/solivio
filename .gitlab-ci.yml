# .gitlab-ci.yml
# Monorepo pipeline for Solivio (solivio-api + solivio-frontend).
# Jobs run only when their respective files change (rules: changes:).
# Backend and frontend pipelines are independent via DAG (needs:).
#
# Required CI/CD variables (Settings > CI/CD > Variables):
#   SSH_PRIVATE_KEY   - private key to connect to the production server (protected, masked)
#   DEPLOY_HOST       - production server IP or hostname (protected)
#   DEPLOY_USER       - SSH user on the production server (protected)
#   PUBLIC_API_URL    - public backend URL for the frontend env (protected)
#
# Image registry: GitLab Container Registry (CI_REGISTRY_* variables are automatic).
# Deployment: SSH into the server and restart the relevant container.

stages:
  - validate
  - test
  - build
  - deploy

# -----------------------------------------------------------------------
# Global variables
# -----------------------------------------------------------------------
variables:
  # Maven: keep the local repository inside the project dir for caching
  MAVEN_OPTS: >-
    -Dmaven.repo.local=${CI_PROJECT_DIR}/.m2/repository
    -Dmaven.color=false
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end"

  # npm: keep the cache inside the project dir for caching
  npm_config_cache: "${CI_PROJECT_DIR}/.npm"

  # Docker image names
  BACKEND_IMAGE: "${CI_REGISTRY_IMAGE}/solivio-api"
  FRONTEND_IMAGE: "${CI_REGISTRY_IMAGE}/solivio_frontend"

# Run pipelines for merge requests, branch pushes, and tags.
# The rules: changes: conditions on each job narrow down execution further.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# -----------------------------------------------------------------------
# BACKEND - validate
# Fails fast: checkstyle must pass before tests run.
# -----------------------------------------------------------------------
backend:checkstyle:
  stage: validate
  image: eclipse-temurin:25-jdk-alpine
  cache:
    key: "maven-${CI_COMMIT_REF_SLUG}"
    paths:
      - .m2/repository
  rules:
    - changes:
        - solivio-api/**/*
        - .gitlab-ci.yml
  before_script:
    - apk add --no-cache bash
    - chmod +x solivio-api/mvnw
  script:
    - cd solivio-api
    - ./mvnw ${MAVEN_CLI_OPTS} checkstyle:check

# -----------------------------------------------------------------------
# BACKEND - test
# Runs unit tests and integration tests (Testcontainers via DinD).
# JaCoCo check enforces 80% line coverage and fails the job if not met.
# -----------------------------------------------------------------------
backend:test:
  stage: test
  image: eclipse-temurin:25-jdk-alpine
  # DinD service required for Testcontainers
  # --tls=false avoids the intentional startup delay on non-TLS Docker API
  services:
    - name: docker:dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_RYUK_DISABLED: "true"
  cache:
    key: "maven-${CI_COMMIT_REF_SLUG}"
    paths:
      - .m2/repository
  rules:
    - changes:
        - solivio-api/**/*
        - .gitlab-ci.yml
  needs:
    - backend:checkstyle
  before_script:
    - apk add --no-cache bash
    - chmod +x solivio-api/mvnw
  script:
    - cd solivio-api
    # verify runs: tests + jacoco:check (80% threshold) + jacoco:report
    - ./mvnw ${MAVEN_CLI_OPTS} verify
  artifacts:
    when: always
    paths:
      - solivio-api/target/site/jacoco/
      - solivio-api/target/surefire-reports/
    reports:
      junit: solivio-api/target/surefire-reports/TEST-*.xml
    expire_in: 2 weeks

# -----------------------------------------------------------------------
# BACKEND - build Docker image
# Runs only on the default branch after tests pass.
# Uses Kaniko (no privileged containers required).
# Pushes two tags: the short commit SHA and latest.
# -----------------------------------------------------------------------
backend:build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - solivio-api/**/*
        - .gitlab-ci.yml
  needs:
    - backend:test
  before_script:
    - mkdir -p /kaniko/.docker
    - >-
      echo "{\"auths\":{\"${CI_REGISTRY}\":{\"username\":\"${CI_REGISTRY_USER}\",\"password\":\"${CI_REGISTRY_PASSWORD}\"}}}"
      > /kaniko/.docker/config.json
  script:
    - >-
      /kaniko/executor
      --context "${CI_PROJECT_DIR}/solivio-api"
      --dockerfile "${CI_PROJECT_DIR}/solivio-api/Dockerfile"
      --destination "${BACKEND_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      --destination "${BACKEND_IMAGE}:latest"
      --cache=true
      --cache-repo "${BACKEND_IMAGE}/cache"

# -----------------------------------------------------------------------
# BACKEND - deploy to production
# Manual trigger: review the build before deploying.
# Change to when: on_success for automatic deployment.
# SSH into the server, pull the new image, restart only the backend container.
# -----------------------------------------------------------------------
backend:deploy:
  stage: deploy
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - solivio-api/**/*
      when: manual
  needs:
    - backend:build
  environment:
    name: production/backend
    url: ${PUBLIC_API_URL}
  before_script:
    - apk add --no-cache openssh-client bash
    - eval $(ssh-agent -s)
    - echo "${SSH_PRIVATE_KEY}" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts
  script:
    - >-
      ssh "${DEPLOY_USER}@${DEPLOY_HOST}"
      "docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
      && docker compose -f /opt/solivio/docker-compose.yml pull backend
      && docker compose -f /opt/solivio/docker-compose.yml up -d --no-deps --remove-orphans backend"

# -----------------------------------------------------------------------
# FRONTEND - validate
# -----------------------------------------------------------------------
frontend:lint:
  stage: validate
  image: node:24-alpine
  cache:
    key: "npm-${CI_COMMIT_REF_SLUG}"
    paths:
      - .npm
  rules:
    - changes:
        - solivio_frontend/**/*
        - .gitlab-ci.yml
  before_script:
    - cd solivio_frontend && npm ci
  script:
    - cd solivio_frontend && npm run lint

# -----------------------------------------------------------------------
# FRONTEND - unit tests
# -----------------------------------------------------------------------
frontend:test:
  stage: test
  image: node:24-alpine
  cache:
    key: "npm-${CI_COMMIT_REF_SLUG}"
    paths:
      - .npm
  rules:
    - changes:
        - solivio_frontend/**/*
        - .gitlab-ci.yml
  needs:
    - frontend:lint
  before_script:
    - cd solivio_frontend && npm ci
  script:
    - cd solivio_frontend && npm run test:coverage
  artifacts:
    when: always
    paths:
      - solivio_frontend/coverage/
    expire_in: 2 weeks

# -----------------------------------------------------------------------
# FRONTEND - E2E tests (Playwright)
# allow_failure: true because E2E requires a running application.
# Set up a staging environment and remove allow_failure when ready.
# -----------------------------------------------------------------------
frontend:e2e:
  stage: test
  image: mcr.microsoft.com/playwright:v1.60.0-focal
  rules:
    - changes:
        - solivio_frontend/**/*
        - .gitlab-ci.yml
  needs:
    - frontend:lint
  before_script:
    - cd solivio_frontend && npm ci
  script:
    - cd solivio_frontend && npm run test:e2e
  artifacts:
    when: always
    paths:
      - solivio_frontend/playwright-report/
    expire_in: 1 week
  allow_failure: true

# -----------------------------------------------------------------------
# FRONTEND - build Docker image
# -----------------------------------------------------------------------
frontend:build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - solivio_frontend/**/*
        - .gitlab-ci.yml
  needs:
    - frontend:test
  before_script:
    - mkdir -p /kaniko/.docker
    - >-
      echo "{\"auths\":{\"${CI_REGISTRY}\":{\"username\":\"${CI_REGISTRY_USER}\",\"password\":\"${CI_REGISTRY_PASSWORD}\"}}}"
      > /kaniko/.docker/config.json
  script:
    - >-
      /kaniko/executor
      --context "${CI_PROJECT_DIR}/solivio_frontend"
      --dockerfile "${CI_PROJECT_DIR}/solivio_frontend/Dockerfile"
      --destination "${FRONTEND_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      --destination "${FRONTEND_IMAGE}:latest"
      --cache=true
      --cache-repo "${FRONTEND_IMAGE}/cache"

# -----------------------------------------------------------------------
# FRONTEND - deploy to production
# -----------------------------------------------------------------------
frontend:deploy:
  stage: deploy
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - solivio_frontend/**/*
      when: manual
  needs:
    - frontend:build
  environment:
    name: production/frontend
  before_script:
    - apk add --no-cache openssh-client bash
    - eval $(ssh-agent -s)
    - echo "${SSH_PRIVATE_KEY}" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts
  script:
    - >-
      ssh "${DEPLOY_USER}@${DEPLOY_HOST}"
      "docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
      && docker compose -f /opt/solivio/docker-compose.yml pull frontend
      && docker compose -f /opt/solivio/docker-compose.yml up -d --no-deps --remove-orphans frontend"