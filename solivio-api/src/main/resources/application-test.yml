# application-test.yml
# Profil de test active automatiquement via @SolivioIntegrationTest.
# Testcontainers (@ServiceConnection) fournit une vraie base PostgreSQL
# et surcharge automatiquement les proprietes de connexion.

spring:
  jpa:
    hibernate:
      # Flyway reconstruit le schema depuis zero via Testcontainers ; validate est inutile en tests.
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true

  mail:
    # host et port injectes dynamiquement par DynamicPropertyRegistrar (Mailpit Testcontainers).
    test-connection: false
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret

management:
  endpoints:
    web:
      exposure:
        include: health

solivio:
  auth:
    jwt-secret: test-jwt-secret-key-must-be-at-least-32-bytes-long-for-testing
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 30
  uploads:
    logos-dir: /tmp/solivio-logos-test
    avatars-dir: /tmp/solivio-avatars-test

logging:
  level:
    root: WARN
    com.solivio: INFO
    org.testcontainers: INFO
    org.springframework.test: DEBUG
    org.flywaydb: WARN
