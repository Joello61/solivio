# application.yml
# Configuration de base chargee dans tous les profils.
# Les valeurs sensibles viennent uniquement des variables d'environnement
# (injectees par Infisical en production, voir .env.example). Aucun secret
# n'a de valeur par defaut ici : l'application refuse de demarrer s'il manque.
#
# Surcharges par profil : application-dev.yml, application-test.yml
# En production : SPRING_PROFILES_ACTIVE=prod + toutes les ${ENV_VAR} fournies.

spring:
  application:
    name: solivio-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/solivio}
    username: ${SPRING_DATASOURCE_USERNAME:solivio}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  # Google OAuth2 : seul fournisseur externe supporte.
  # Spring refuse de demarrer si GOOGLE_CLIENT_ID est vide.
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: profile,email
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

  # Evenements internes (ADR-003) : registre de publication JDBC, schema
  # gere par Flyway (V8), evenements traites archives pour garder une trace.
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
      completion-mode: archive
      republish-outstanding-events-on-restart: true
      # Une publication bloquee au-dela de ces durees passe en echec et sera
      # relancee par MaintenancePublicationsJob.
      staleness:
        published: PT30M
        processing: PT15M
        resubmitted: PT15M

  # Executeur des ecouteurs @ApplicationModuleListener (emails, statistiques).
  task:
    execution:
      thread-name-prefix: solivio-evt-
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 500

  thymeleaf:
    check-template-location: false
    prefix: classpath:/templates/email/
    suffix: .html

server:
  port: 8080
  # Derriere Traefik : X-Forwarded-* donne le schema (cookies Secure) et l'IP cliente
  # (limite de debit). Traefik ecrase ces en-tetes, un client ne peut pas les forger.
  forward-headers-strategy: framework
  servlet:
    context-path: /
  compression:
    enabled: true

management:
  # Port de gestion distinct, jamais route par Traefik : seul Prometheus y accede,
  # par le reseau Docker d'observabilite, avec le jeton METRICS_SCRAPE_TOKEN.
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true
  # Les traces partent vers Tempo (OTLP) seulement dans le profil prod. Tempo ne
  # recoit pas de metriques : elles sont scrapees par Prometheus.
  tracing:
    export:
      enabled: false
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      consume: W3C
      produce: W3C
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    resource-attributes:
      deployment.environment.name: ${DEPLOYMENT_ENVIRONMENT:local}
  metrics:
    tags:
      application: ${spring.application.name}
    # Buckets d'histogramme pour calculer les percentiles de latence dans Prometheus
    # (tableau de bord et alerte p95 du depot infrastructure).
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
  show-actuator: false

logging:
  level:
    root: INFO
    com.solivio: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: INFO

solivio:
  auth:
    # Duree de vie du JWT access token (minutes).
    access-token-expiration-minutes: ${SOLIVIO_ACCESS_TOKEN_EXPIRATION:15}
    # Duree de vie du JWT refresh token (jours).
    refresh-token-expiration-days: ${SOLIVIO_REFRESH_TOKEN_EXPIRATION:30}
    # Cle HMAC-SHA256 de signature des JWT, 32 octets minimum.
    jwt-secret: ${SOLIVIO_AUTH_JWT_SECRET:}
    # URI de redirection apres login Google reussi (vers le frontend).
    post-login-redirect-uri: ${SOLIVIO_POST_LOGIN_REDIRECT_URI:http://localhost:3000}
    # URI de redirection apres logout (vers le frontend).
    post-logout-redirect-uri: ${SOLIVIO_POST_LOGOUT_REDIRECT_URI:http://localhost:3000}
  mail:
    from: noreply@solivio.app
    reply-to: contact@solivio.app
  observabilite:
    # Jeton attendu de Prometheus sur /actuator/prometheus. Vide = metriques inaccessibles.
    metrics-scrape-token: ${METRICS_SCRAPE_TOKEN:}
  securite:
    limite-debit-auth:
      # Appels POST par minute et par IP sur les points d'entree publics d'authentification.
      requetes-par-minute: 10
  cors:
    allowed-origins: ${SOLIVIO_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  uploads:
    logos-dir: ${SOLIVIO_LOGOS_DIR:/var/solivio/logos}
    avatars-dir: ${SOLIVIO_UPLOADS_AVATARS_DIR:/var/solivio/avatars}
  maps:
    # Cle Google Maps Platform, publique cote navigateur : la restreindre par
    # referent HTTP dans la console Google. Vide = carte desactivee.
    api-key: ${GOOGLE_MAPS_API_KEY:}
