# application.yml
# Configuration de base chargee dans tous les profils.
# Les valeurs sensibles viennent des variables d'environnement ou de Spring Cloud Vault.
#
# Surcharges par profil : application-dev.yml, application-test.yml
# En production : SPRING_PROFILES_ACTIVE=prod + toutes les ${ENV_VAR} fournies.

spring:
  application:
    name: solivio-api

  config:
    import: "optional:vault://"

  cloud:
    vault:
      uri: ${SPRING_CLOUD_VAULT_URI:http://localhost:8200}
      token: ${SPRING_CLOUD_VAULT_TOKEN:}
      scheme: http
      kv:
        enabled: true
        backend: secret
        default-context: ${spring.application.name}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/solivio}
    username: ${SPRING_DATASOURCE_USERNAME:solivio}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration/shared
    baseline-on-migrate: false
    validate-on-migrate: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ${spring.application.name}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.solivio.*"

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  # Google OAuth2 : seul fournisseur externe supporte.
  # Les credentials Google sont injectes depuis OpenBao en production.
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid,profile,email
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

  thymeleaf:
    check-template-location: false
    prefix: classpath:/templates/email/
    suffix: .html

server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
  show-actuator: false

logging:
  level:
    root: INFO
    com.solivio: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: INFO

solivio:
  multitenancy:
    default-schema: public
  auth:
    # Duree de vie du JWT access token (minutes).
    access-token-expiration-minutes: ${SOLIVIO_ACCESS_TOKEN_EXPIRATION:15}
    # Duree de vie du JWT refresh token (jours).
    refresh-token-expiration-days: ${SOLIVIO_REFRESH_TOKEN_EXPIRATION:30}
    # Cle secrete HMAC-SHA256 pour signer les JWT (32 octets minimum, base64).
    # En prod : injectee depuis OpenBao (secret/solivio-api, cle jwt.secret).
    jwt-secret: ${jwt.secret:}
    # URI de redirection apres login Google reussi (vers le frontend).
    post-login-redirect-uri: ${SOLIVIO_POST_LOGIN_REDIRECT_URI:http://localhost:3000}
    # URI de redirection apres logout (vers le frontend).
    post-logout-redirect-uri: ${SOLIVIO_POST_LOGOUT_REDIRECT_URI:http://localhost:3000}
  mail:
    from: noreply@solivio.app
    reply-to: contact@solivio.app
  cors:
    allowed-origins: ${SOLIVIO_CORS_ALLOWED_ORIGINS:http://localhost:3000}
