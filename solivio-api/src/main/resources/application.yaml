# application.yml
# Base configuration loaded in all profiles.
# Sensitive values are read from environment variables or injected
# by Spring Cloud Vault Config at startup.
#
# Profile-specific overrides: application-dev.yml, application-test.yml
# In production, set SPRING_PROFILES_ACTIVE=prod and ensure all
# ${ENV_VAR} references are provided (via Docker Compose or the platform).
#
# Place this file at: solivio-api/src/main/resources/application.yml

spring:
  application:
    name: solivio-api

  # Vault secrets are imported at startup.
  # "optional:" means the app still starts if Vault is unreachable.
  # Remove "optional:" in production to make Vault mandatory.
  config:
    import: "optional:vault://"

  cloud:
    vault:
      uri: ${SPRING_CLOUD_VAULT_URI:http://localhost:8200}
      token: ${SPRING_CLOUD_VAULT_TOKEN:}
      scheme: http
      kv:
        enabled: true
        backend: secret
        default-context: ${spring.application.name}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/solivio}
    username: ${SPRING_DATASOURCE_USERNAME:solivio}
    # In production, this value is provided by Spring Cloud Vault Config.
    # In dev, set SPRING_DATASOURCE_PASSWORD in your environment.
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      # Flyway manages the schema. Hibernate only validates against it.
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Schema-based multi-tenancy. Requires custom beans:
        # CurrentTenantIdentifierResolver and MultiTenantConnectionProvider.
        multiTenancy: SCHEMA
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    # Each tenant schema uses its own migration history table.
    # Custom Flyway configuration per schema is handled in FlywayConfig.

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ${spring.application.name}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.solivio.*"

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  # BFF pattern: Spring Boot acts as both OAuth2 Client (login flow)
  # and Resource Server (JWT validation on API calls).
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: solivio-backend
            client-secret: ${KEYCLOAK_CLIENT_SECRET:}
            scope: openid,profile,email,roles
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9090/realms/solivio}
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9090/realms/solivio}

  # Thymeleaf is used exclusively for HTML email templates.
  # Disable web template resolution to avoid interference with REST endpoints.
  thymeleaf:
    check-template-location: false
    prefix: classpath:/templates/email/
    suffix: .html

server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
  show-actuator: false

logging:
  level:
    root: INFO
    com.solivio: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: INFO

# Custom application properties
solivio:
  multitenancy:
    default-schema: public
  mail:
    from: noreply@solivio.app
    reply-to: contact@solivio.app