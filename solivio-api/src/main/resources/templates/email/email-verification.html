<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vérification de votre email</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f5;font-family:system-ui,-apple-system,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" width="560" style="background:#ffffff;border-radius:8px;overflow:hidden;max-width:560px;width:100%;">

          <tr>
            <td style="background:#16513F;padding:32px 40px;text-align:center;">
              <span style="color:#ffffff;font-size:22px;font-weight:700;letter-spacing:-0.5px;">Solivio</span>
            </td>
          </tr>

          <tr>
            <td style="padding:40px 40px 24px;">
              <h1 style="margin:0 0 8px;font-size:22px;font-weight:700;color:#111827;">
                Bonjour, <span th:text="${prenom}">Prénom</span>
              </h1>
              <p style="margin:0 0 32px;font-size:15px;line-height:1.6;color:#374151;">
                Saisissez ce code pour vérifier votre adresse email.
                Ce code est valable pendant 15 minutes.
              </p>
              <div style="text-align:center;background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:32px 24px;margin:0 0 32px;">
                <span th:text="${code}" style="font-size:40px;font-weight:700;letter-spacing:12px;color:#111827;font-family:monospace;">
                  123456
                </span>
              </div>
              <p style="margin:0;font-size:13px;color:#6b7280;text-align:center;">
                N'avez-vous pas demande ce code ? Ignorez cet email.
              </p>
            </td>
          </tr>

          <tr>
            <td style="padding:0 40px 40px;">
              <hr style="border:none;border-top:1px solid #e5e7eb;margin:0 0 24px;">
              <p style="margin:0;font-size:13px;color:#9ca3af;">
                Pour votre sécurité, ne partagez jamais ce code avec quelqu'un d'autre.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
