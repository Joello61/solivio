<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenue sur Solivio</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f5;font-family:system-ui,-apple-system,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" width="560" style="background:#ffffff;border-radius:8px;overflow:hidden;max-width:560px;width:100%;">

          <tr>
            <td style="background:#2563eb;padding:32px 40px;text-align:center;">
              <span style="color:#ffffff;font-size:22px;font-weight:700;letter-spacing:-0.5px;">Solivio</span>
            </td>
          </tr>

          <tr>
            <td style="padding:40px 40px 24px;">
              <h1 style="margin:0 0 16px;font-size:22px;font-weight:700;color:#111827;">
                Bienvenue, <span th:text="${prenom}">Prenom</span> !
              </h1>
              <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#374151;">
                Votre compte Solivio a ete cree avec succes. Vous pouvez maintenant acceder aux
                distributions et services de votre association.
              </p>
              <table role="presentation" cellspacing="0" cellpadding="0">
                <tr>
                  <td style="border-radius:6px;background:#2563eb;">
                    <a th:href="${appUrl}" href="#"
                       style="display:inline-block;padding:12px 24px;color:#ffffff;font-size:15px;font-weight:600;text-decoration:none;">
                      Acceder a mon espace
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td style="padding:0 40px 40px;">
              <hr style="border:none;border-top:1px solid #e5e7eb;margin:0 0 24px;">
              <p style="margin:0;font-size:13px;color:#9ca3af;">
                Si vous n'avez pas cree ce compte, ignorez cet email ou contactez
                <a href="mailto:contact@solivio.app" style="color:#2563eb;">contact@solivio.app</a>.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
