# application-dev.yml
# Profil de developpement. Active avec : SPRING_PROFILES_ACTIVE=dev
# Infrastructure attendue : docker compose -f docker-compose-dev.yml up -d

spring:
  config:
    import: "optional:vault://"

  cloud:
    vault:
      uri: http://localhost:8200

  datasource:
    url: jdbc:postgresql://localhost:5436/solivio
    username: solivio
    password: solivio_dev

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9093

  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false

  # En dev, Google OAuth est optionnel.
  # Renseigner GOOGLE_CLIENT_ID et GOOGLE_CLIENT_SECRET dans .env.local
  # ou dans OpenBao dev pour tester le flux Google.
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dev-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dev-google-client-secret}

solivio:
  auth:
    # Cle de dev uniquement - generee pour le profil dev.
    # En production la cle est injectee depuis OpenBao.
    jwt-secret: dev-jwt-secret-key-must-be-at-least-32-bytes-long-for-hmac256
    post-login-redirect-uri: http://localhost:3000
    post-logout-redirect-uri: http://localhost:3000
  cors:
    allowed-origins: http://localhost:3000
  uploads:
    logos-dir: /tmp/solivio-logos

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.solivio: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.kafka: DEBUG
    org.flywaydb: DEBUG
