# application-dev.yml
# Profil de developpement. Active avec : SPRING_PROFILES_ACTIVE=dev
# Infrastructure attendue : docker compose -f docker-compose-dev.yml up -d

spring:
  datasource:
    url: jdbc:postgresql://localhost:5436/solivio
    username: solivio
    password: solivio_dev

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9093

  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false

  # En dev, la connexion Google est optionnelle : sans GOOGLE_CLIENT_ID et
  # GOOGLE_CLIENT_SECRET en variables d'environnement, l'application demarre
  # avec des valeurs factices et seul le bouton Google echoue.
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:326901339653-qqkbuml4g1lj65e9gph0t6rqd8k98hco.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET: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}

solivio:
  auth:
    # Cle de developpement uniquement, sans valeur hors de la machine locale.
    jwt-secret: ${SOLIVIO_AUTH_JWT_SECRET:dev-jwt-secret-key-must-be-at-least-32-bytes-long-for-hmac256}
    post-login-redirect-uri: http://localhost:3000
    post-logout-redirect-uri: http://localhost:3000
  cors:
    allowed-origins: http://localhost:3000
  uploads:
    logos-dir: /tmp/solivio-logos
    avatars-dir: /tmp/solivio-avatars

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.solivio: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.kafka: DEBUG
    org.flywaydb: DEBUG
