# application-dev.yml
# Development profile overrides.
# Activated by: SPRING_PROFILES_ACTIVE=dev
# Expected infrastructure: docker compose -f docker-compose-dev.yml up -d
#
# Place this file at: solivio-api/src/main/resources/application-dev.yml

spring:
  config:
    import: "optional:vault://"

  cloud:
    vault:
      uri: http://localhost:8200
      # Token injecte via SPRING_CLOUD_VAULT_TOKEN=root (variable d'environnement).
      # Ne pas mettre le token en clair ici : il n'est pas lu a temps par
      # le ConfigDataEnvironmentPostProcessor (meme probleme que pour les tests).

  datasource:
    url: jdbc:postgresql://localhost:5436/solivio
    username: solivio
    password: solivio_dev

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Backend running on host connects via the EXTERNAL Kafka listener.
  # See docker-compose-dev.yml KAFKA_ADVERTISED_LISTENERS for port 9093.
  kafka:
    bootstrap-servers: localhost:9093

  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-secret: ${keycloak.client-secret:change-me}

solivio:
  auth:
    post-login-redirect-uri: http://localhost:3000
    post-logout-redirect-uri: http://localhost:3000
  cookie:
    # Cle de dev uniquement - generee et stockee dans OpenBao local.
    # Valeur de fallback si OpenBao ne repond pas en dev.
    encryption-key: TBtJGRAtY88z4VBjjke9shhAAp6C+LjbHUiJoI2KN5o=
  cors:
    allowed-origins: http://localhost:3000

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # Expose all Actuator endpoints in dev for debugging.
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.solivio: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    # Logs the actual values bound to SQL parameters. Disable for sensitive data.
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.kafka: DEBUG
    org.flywaydb: DEBUG