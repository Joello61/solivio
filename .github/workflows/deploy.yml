name: Deploy

# Apres le succes complet du workflow CI sur un push : dev part en preproduction,
# main en production. Les images sont construites une seule fois ici, etiquetees par
# le SHA du commit teste, puis tirees par le serveur : jamais de build sur le VPS.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev, main]

permissions:
  contents: read

jobs:
  build-and-push:
    name: Images (GHCR)
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      image_base: ${{ steps.meta.outputs.image_base }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      # Le commit reellement teste par la CI, jamais la tete de branche qui a pu avancer.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Metadonnees
        id: meta
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "image_base=ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "image_tag=${SHA:0:12}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Backend
        uses: docker/build-push-action@v7
        with:
          context: ./solivio-api
          push: true
          tags: ${{ steps.meta.outputs.image_base }}-backend:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./solivio_frontend
          push: true
          tags: ${{ steps.meta.outputs.image_base }}-frontend:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy-staging:
    name: Preproduction
    needs: build-and-push
    if: github.event.workflow_run.head_branch == 'dev'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-staging
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Secrets de l'environnement GitHub "staging", memes noms qu'en production.
      - name: Deploiement SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          IMAGE_BASE: ${{ needs.build-and-push.outputs.image_base }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: docker/deploy/ssh-deploy.sh staging

  # La validation manuelle vient de la regle "Required reviewers" de l'environnement
  # GitHub "production" (Settings > Environments), pas de ce fichier.
  deploy-production:
    name: Production
    needs: build-and-push
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploiement SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          IMAGE_BASE: ${{ needs.build-and-push.outputs.image_base }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: docker/deploy/ssh-deploy.sh production
