name: CI

# Integration continue sur dev (preproduction) et main (production), et sur toute
# pull request vers ces branches. Le deploiement (deploy.yml) ne part qu'apres le
# succes complet de ce workflow sur un push.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests, couverture, Checkstyle, modularite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solivio-api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Tests unitaires et d'integration (Testcontainers sur le Docker du runner),
      # JaCoCo 80 pour cent bloquant, Checkstyle et ModularityTest.
      - name: Verify
        run: ./mvnw -B verify

      - name: Rapport de couverture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco
          path: solivio-api/target/site/jacoco
          retention-days: 7

  frontend:
    name: Frontend (audit, lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solivio_frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: solivio_frontend/package-lock.json

      - run: npm ci

      # Bloque sur les vulnerabilites hautes et critiques.
      - name: Audit des dependances
        run: npm audit --audit-level=high

      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx vitest run

      # Meme configuration que l'image deployee : API sur le meme domaine.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ""

  e2e:
    name: Bout en bout (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: solivio
          POSTGRES_USER: solivio
          POSTGRES_PASSWORD: solivio_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solivio -d solivio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.31.4
        ports:
          - 1025:1025
    env:
      # Comptes du profil seed (DataSeeder), sans valeur hors developpement.
      E2E_EMAIL: coordo1@solivio.app
      E2E_PASSWORD: Solivio2026!
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: solivio_frontend/package-lock.json

      - name: Demarrer le backend (profils dev et seed)
        working-directory: solivio-api
        env:
          SPRING_PROFILES_ACTIVE: dev,seed
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/solivio
          SPRING_DATASOURCE_PASSWORD: solivio_ci
        run: |
          ./mvnw -B -q package -DskipTests
          nohup java -jar target/solivio-api-*.jar > ../backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/actuator/health/readiness > /dev/null; then exit 0; fi
            sleep 3
          done
          cat ../backend.log
          exit 1

      - name: Construire et demarrer le frontend
        working-directory: solivio_frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          API_URL: http://localhost:8080
        run: |
          npm ci
          npm run build
          nohup npm start > ../frontend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Installer Chromium
        working-directory: solivio_frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright
        working-directory: solivio_frontend
        run: npx playwright test

      - name: Journaux et rapport
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e
          path: |
            backend.log
            frontend.log
            solivio_frontend/playwright-report
          retention-days: 7

  secrets:
    name: Detection de secrets (gitleaks)
    runs-on: ubuntu-latest
    # Sur une pull request, l'action liste ses commits par l'API.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4

  dependances:
    name: Revue des dependances
    # Indisponible sur un depot prive sans GitHub Advanced Security : actif une
    # fois le depot public.
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
