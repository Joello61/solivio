# docker-compose-dev.yml - development environment
#
# Usage: docker compose -f docker-compose-dev.yml up -d
#
# Starts all infrastructure services. Backend and frontend run on the host
# for hot-reload (IntelliJ / npm run dev).
#
# Credentials are intentionally simple. Never use in production.
#
# Exposed ports:
#   PostgreSQL  : localhost:5436  (5432 occupied by system PostgreSQL)
#   Mailpit UI  : localhost:8025
#   Mailpit SMTP: localhost:1025
#
# Spring Boot (application-dev.yml):
#   spring.datasource.url: jdbc:postgresql://localhost:5436/solivio
#   spring.mail.host: localhost / port: 1025

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 18
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: solivio_dev_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: solivio
      POSTGRES_USER: solivio
      POSTGRES_PASSWORD: solivio_dev
    ports:
      - "5436:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql
    networks:
      - solivio_dev_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solivio -d solivio"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Mailpit - SMTP local + visualiseur d'emails
  # Intercepte tous les emails sortants (aucun email reel envoye en dev).
  # UI: http://localhost:8025
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:v1.31.4
    container_name: solivio_dev_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - solivio_dev_net

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  dev_postgres_data:
    driver: local

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  solivio_dev_net:
    driver: bridge
