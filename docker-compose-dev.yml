# docker-compose-dev.yml - development environment
#
# Usage: docker compose -f docker-compose-dev.yml up -d
#
# Starts all infrastructure services. Backend and frontend run on the host
# for hot-reload (IntelliJ / npm run dev).
#
# Credentials are intentionally simple. Never use in production.
#
# Exposed ports:
#   PostgreSQL  : localhost:5436  (5432 occupied by system PostgreSQL)
#   Kafka       : localhost:9093  (external listener for host access)
#   OpenBao     : localhost:8200
#   Mailpit UI  : localhost:8025
#   Mailpit SMTP: localhost:1025
#
# Spring Boot (application-dev.yml):
#   spring.datasource.url: jdbc:postgresql://localhost:5436/solivio
#   spring.kafka.bootstrap-servers: localhost:9093
#   spring.mail.host: localhost / port: 1025
#   spring.cloud.vault.uri: http://localhost:8200
#   SPRING_CLOUD_VAULT_TOKEN=root (env var)

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 18
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: solivio_dev_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: solivio
      POSTGRES_USER: solivio
      POSTGRES_PASSWORD: solivio_dev
    ports:
      - "5436:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql
    networks:
      - solivio_dev_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solivio -d solivio"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Apache Kafka 4.0.2 - KRaft mode, single broker
  # Two listeners:
  #   INTERNAL (kafka:9092)  - container-to-container
  #   EXTERNAL (localhost:9093) - Spring Boot running on the host
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:4.0.2
    container_name: solivio_dev_kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      CLUSTER_ID: dev-cluster-id-solivio-00000
    ports:
      - "9092:9092"
      - "9093:9093"
    volumes:
      - dev_kafka_data:/var/lib/kafka/data
    networks:
      - solivio_dev_net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # OpenBao 2 - dev mode
  # Auto-unsealed, root token = "root", in-memory storage.
  # UI: http://localhost:8200 (token: root)
  # ---------------------------------------------------------------------------
  openbao:
    image: openbao/openbao:2
    container_name: solivio_dev_openbao
    restart: unless-stopped
    command: server -dev -dev-root-token-id=root -dev-listen-address=0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    networks:
      - solivio_dev_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8200/v1/sys/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Mailpit - SMTP local + visualiseur d'emails
  # Intercepte tous les emails sortants (aucun email reel envoye en dev).
  # UI: http://localhost:8025
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: solivio_dev_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - solivio_dev_net

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  dev_postgres_data:
    driver: local
  dev_kafka_data:
    driver: local

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  solivio_dev_net:
    driver: bridge
