# Stack deployee de Solivio (preproduction et production), lancee par
# docker/deploy/ssh-deploy.sh. Le developpement local utilise docker-compose-dev.yml.
#
# Les images sont construites et testees une seule fois par la CI, puis tirees de
# GHCR (BACKEND_IMAGE, FRONTEND_IMAGE, BACKUP_IMAGE, etiquetees par SHA) : jamais de build sur
# le serveur. Les secrets sont injectes par "infisical run" dans l'environnement de
# docker compose ; aucun fichier .env rempli n'existe sur le serveur (.env.example
# liste les variables).
#
# Aucun port n'est publie sur l'hote : Traefik route vers backend et frontend
# (docker-compose.prod.traefik.yml, cree sur le serveur a partir de l'exemple) et
# PostgreSQL reste sur le reseau interne du projet.

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?}
      POSTGRES_USER: ${DB_USER:?}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    image: ${BACKEND_IMAGE:?}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:?}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SOLIVIO_AUTH_JWT_SECRET: ${SOLIVIO_AUTH_JWT_SECRET:?}
      SOLIVIO_POST_LOGIN_REDIRECT_URI: ${FRONTEND_URL:?}
      SOLIVIO_POST_LOGOUT_REDIRECT_URI: ${FRONTEND_URL}
      SOLIVIO_CORS_ALLOWED_ORIGINS: ${FRONTEND_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      SPRING_MAIL_HOST: ${SMTP_HOST:?}
      SPRING_MAIL_PORT: ${SMTP_PORT:-587}
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD:-}
      SOLIVIO_MAIL_FROM: ${SOLIVIO_MAIL_FROM:?}
      METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:?}
      SOLIVIO_LOGOS_DIR: /var/solivio/uploads/logos
      SOLIVIO_UPLOADS_AVATARS_DIR: /var/solivio/uploads/avatars
      JAVA_OPTS: "-XX:MaxRAMPercentage=75"
    mem_limit: 1g
    volumes:
      - uploads_data:/var/solivio/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE:?}
    restart: unless-stopped
    environment:
      # Appels faits par le serveur Next.js (composants serveur, routes /api internes).
      API_URL: http://backend:8080
    mem_limit: 512m
    depends_on:
      backend:
        condition: service_healthy

  # Sauvegarde quotidienne chiffree vers Cloudflare R2 (docker/backup/README.md). Le
  # jeton R2 dedie, limite au bucket des sauvegardes, n'est donne qu'a ce service.
  backup:
    image: ${BACKUP_IMAGE:?}
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGDATABASE: ${DB_NAME}
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      BACKUP_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT}
      R2_BACKUPS_BUCKET: ${R2_BACKUPS_BUCKET:?}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_REGION: auto
      RCLONE_CONFIG_R2_ENDPOINT: ${R2_ENDPOINT:?}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${R2_BACKUPS_ACCESS_KEY_ID:?}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${R2_BACKUPS_SECRET_ACCESS_KEY:?}
      # Le jeton n'a pas le droit de creer de bucket.
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
    mem_limit: 256m
    volumes:
      - uploads_data:/var/solivio/uploads:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
