# docker-compose.yml - production
#
# Usage with Coolify: Coolify reads this file and manages routing and TLS.
# Usage standalone:   docker compose up -d
#
# Secrets: injected as environment variables (Infisical in production,
# see .env.example for the full list). Never commit a filled .env file.
#
# TLS is handled by Coolify (or Traefik in front). Services communicate over
# the internal network without TLS between containers.
#
# CLUSTER_ID for Kafka must be generated once and kept stable:
#   docker run --rm apache/kafka:4 /opt/kafka/bin/kafka-storage.sh random-uuid
# Then set KAFKA_CLUSTER_ID in .env with that value.

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 18
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: solivio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - solivio_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Apache Kafka 4.0.2 - KRaft mode (no ZooKeeper)
  # Single broker for small-scale production.
  # KAFKA_CLUSTER_ID must be generated once and kept stable in .env.
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:4.0.2
    container_name: solivio_kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - solivio_net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Backend - Spring Boot 4 / Java 25
  # ---------------------------------------------------------------------------
  backend:
    image: registry.gitlab.com/${GITLAB_PROJECT}/solivio-api:${APP_VERSION:-latest}
    container_name: solivio_backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SOLIVIO_AUTH_JWT_SECRET: ${SOLIVIO_AUTH_JWT_SECRET}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SOLIVIO_POST_LOGIN_REDIRECT_URI: ${FRONTEND_URL}
      SOLIVIO_POST_LOGOUT_REDIRECT_URI: ${FRONTEND_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      SOLIVIO_CORS_ALLOWED_ORIGINS: ${FRONTEND_URL}
      SPRING_MAIL_HOST: ${SMTP_HOST}
      SPRING_MAIL_PORT: ${SMTP_PORT:-587}
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD}
      SOLIVIO_LOGOS_DIR: /var/solivio/uploads/logos
      SOLIVIO_UPLOADS_AVATARS_DIR: /var/solivio/uploads/avatars
      JAVA_OPTS: "-Xmx512m"
    volumes:
      - uploads_data:/var/solivio/uploads
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - solivio_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ---------------------------------------------------------------------------
  # Frontend - Next.js 16
  # ---------------------------------------------------------------------------
  frontend:
    image: registry.gitlab.com/${GITLAB_PROJECT}/solivio-frontend:${APP_VERSION:-latest}
    container_name: solivio_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_URL: http://backend:8080
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - solivio_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  kafka_data:
    driver: local
  uploads_data:
    driver: local

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  solivio_net:
    driver: bridge
